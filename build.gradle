plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
	id 'maven-publish'
}

version = "${project.mod_version}+26.3"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Simple Voice Chat (henkelmax) maven – hosts the voicechat-api artifact
	maven {
		name = 'Henkelmax'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	// Cloth Config
	maven { url = 'https://maven.shedaniel.me/' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// modern-yarn, the community yarn for 26.x
	maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
}

configurations {
	// The ONNX Runtime jar, in a configuration of its own so the build can reach
	// inside it. See the two tasks at the bottom of this file: the Java API is
	// copied into the mod, the native runtime for five platforms is left behind,
	// and the small JNI shims are lifted out as resources.
	onnxruntime
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Simple Voice Chat plugin API – needed only at compile time. The full
	// Simple Voice Chat mod must be present at runtime (on the client) for this
	// addon to do anything; that is declared as a dependency in fabric.mod.json.
	modCompileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	// Vosk's five Java classes are vendored in src/main/java/org/vosk and its
	// native library is downloaded on demand, because the published jar carries
	// the same library built for three platforms and weighs 25 MB for it.
	implementation "net.java.dev.jna:jna:${project.jna_version}"
	include "net.java.dev.jna:jna:${project.jna_version}"

	// sherpa-onnx ships its models and its native library as bzip2 tarballs, and
	// Java reads neither format on its own.
	implementation "org.apache.commons:commons-compress:${project.commons_compress_version}"
	include "org.apache.commons:commons-compress:${project.commons_compress_version}"

	// ONNX Runtime runs the translation models. Deliberately not include()d: that
	// would carry 41 MB of native runtime for five platforms into the mod, and
	// sherpa-onnx has already put the one that matters on disk.
	implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	onnxruntime "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

	// In-game settings screen. Compile-time only: the mod ships its own screen and
	// only reaches for Cloth when Cloth is actually installed.
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// -PnoCloth leaves Cloth out of the dev client, which is the only way to see
	// the built-in screen: Cloth rides along inside other mods as a nested jar.
	if (!project.hasProperty("noCloth")) {
		modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
			exclude(group: "net.fabricmc.fabric-api")
		}
	}
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", project.minecraft_range
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": project.minecraft_range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ── ONNX Runtime, taken apart ────────────────────────────────────────────────
//
// The published jar is 41 MB, almost all of it the native runtime built for five
// platforms. The mod needs neither: sherpa-onnx already downloads that runtime
// and puts it on disk, so the only piece missing is the small JNI shim that
// binds it to Java. All four of those together are under half a megabyte, which
// is little enough to ride along inside the mod rather than become one more
// thing to download and one more thing to fail.

tasks.register('onnxRuntimeShims', Copy) {
	description = 'Lifts the ONNX Runtime JNI shims out of its jar, one per platform'
	from { zipTree(configurations.onnxruntime.singleFile) }
	include 'ai/onnxruntime/native/*/*onnxruntime4j_jni.*'
	exclude '**/*.dSYM/**'
	includeEmptyDirs = false
	// ai/onnxruntime/native/win-x64/onnxruntime4j_jni.dll
	//   → assets/voice_subtitles/onnxruntime/win-x64/onnxruntime4j_jni.dll
	// Under our own namespace on purpose: left where they were, ONNX Runtime's
	// own loader would find them on the classpath and unpack them itself.
	eachFile { file ->
		file.path = 'assets/voice_subtitles/onnxruntime/' +
				file.sourcePath.split('/')[3] + '/' + file.name
	}
	into layout.buildDirectory.dir('generated/onnxruntime')
}

sourceSets.main.resources.srcDir tasks.named('onnxRuntimeShims')

jar {
	// The Java API travels with the mod; the native runtime inside that jar does
	// not, and neither do the shims, which the task above has already placed.
	from(provider { zipTree(configurations.onnxruntime.singleFile) }) {
		include 'ai/onnxruntime/**'
		exclude 'ai/onnxruntime/native/**'
	}
}

// ── The full build ───────────────────────────────────────────────────────────
//
// The same mod with the recognition engine and the Russian model packed inside
// it, for people who cannot reach GitHub and Hugging Face at any useful speed.
// Nothing is compiled differently: the ordinary jar with a `bundled/` folder
// added, which BundledAssets copies onto disk on the first run.
//
// What goes in comes from a directory beside the project, laid out exactly as it
// will sit in `config/voice_subtitles`:
//
//   bundle/native/sherpa-onnx-<version>-<platform>-jni/lib/…
//   bundle/models/<the folder the model unpacks into>/…
//   bundle/translate/<direction>/…            (optional)
//
// Not in version control – a git repository is no place for a quarter of a
// gigabyte of model weights – so this task quietly does nothing when the
// directory is not there, and `gradlew build` still works for everybody else.
// Point it somewhere else with -Pbundle_dir=…

def bundleDir = file(project.findProperty('bundle_dir') ?: 'bundle')

tasks.register('fullJar', Zip) {
	group = 'build'
	description = 'The mod with the recognition engine and the model packed inside it'
	onlyIf {
		if (!bundleDir.isDirectory()) {
			logger.lifecycle("No bundle at ${bundleDir}, so there is no full jar to build")
			return false
		}
		return true
	}

	dependsOn tasks.named('remapJar')
	from { zipTree(tasks.named('remapJar').get().archiveFile) }
	from(bundleDir) { into 'bundled' }

	archiveBaseName = project.archives_base_name
	archiveVersion = project.version
	archiveClassifier = 'full'
	archiveExtension = 'jar'
	destinationDirectory = layout.buildDirectory.dir('libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── Self-test (dev only) ─────────────────────────────────────────────────────
//
// `gradlew runSelftest` starts a dev client with Simple Voice Chat and a small
// extra mod from src/selftest that walks through the features on its own and
// writes run/selftest-report.txt. None of it goes into the released jar.
// Needs -Pvoicechat_jar=<path to voicechat-fabric for this Minecraft>.

sourceSets {
	selftest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

dependencies {
	if (project.hasProperty('voicechat_jar')) {
		modLocalRuntime files(project.property('voicechat_jar'))
	}
}

loom {
	runs {
		selftest {
			client()
			configName = 'Voice Subtitles self-test'
			source sourceSets.selftest
			programArgs '--quickPlaySingleplayer', 'vs26'
			vmArg '-Dvoice_subtitles.selftest=true'
			vmArg "-Dvoice_subtitles.selftest.ru=${rootProject.file('run/selftest/ru.pcm')}"
			vmArg "-Dvoice_subtitles.selftest.en=${rootProject.file('run/selftest/en.pcm')}"
		}
	}
}
