# Gradle / JVM
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric / Minecraft versions (Minecraft 26.3)
# 26.x ships without obfuscation and has no official yarn. modern-yarn is the
# community continuation (also used by Surveyor and our Antique Atlas port): the
# source keeps its yarn names and the jar is remapped to Mojang's on the way out.
minecraft_version=26.3
yarn_mappings=26.3+build.2
loader_version=0.20.1
fabric_version=0.167.0+26.3
minecraft_range=>=26.3 <26.4

# Simple Voice Chat plugin API (compile-time only)
voicechat_api_version=2.6.13

# Offline speech recognition (bundled)
vosk_version=0.3.45
jna_version=5.7.0
commons_compress_version=1.28.0

# Offline translation. Must stay in step with the onnxruntime that sherpa-onnx
# ships inside SherpaNatives.VERSION: the mod carries only the JNI shim and binds
# it to the runtime that is already on disk, and the two are one version apart at
# most before that stops working.
onnxruntime_version=1.27.0

# Optional: in-game settings screen
cloth_config_version=26.3.159
modmenu_version=21.0.1

# Mod metadata
mod_version=1.2.4
maven_group=com.glamardor
archives_base_name=voice-subtitles
